name = "ajch-fin-manager"
main = "dist/worker.js"
compatibility_date = "2026-10-12"
account_id = "e898ebfc013f074cde300a1ed1c16418"
workers_dev = true

# Environment variables.
# AI keys (GEMINI_API_KEY, CLAUDE_API_KEY, OPENAI_API_KEY) are SECRETS — set them with
#   npx wrangler secret put GEMINI_API_KEY --env production
# (CI does this from the GitHub secret of the same name). Never declare them here:
# a plain var with the same name overwrites the secret on every deploy.
[vars]
GOOGLE_CLIENT_ID = "939308613423-nj666hdbq0et0vt893ubmhebvssfhua5.apps.googleusercontent.com"
DEFAULT_AI_PROVIDER = "gemini"
ENVIRONMENT = "production"

# Cloudflare D1 database for finance data and onboarding
[[d1_databases]]
binding = "DB"
database_name = "finance-manager-db"
database_id = "077138b5-baf3-46e7-83d1-fcc555112a17"
migrations_dir = "db/migrations"

# Cloudflare KV namespace for user sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"

# KV namespace for AI token cache (optional, for performance)
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "token-cache-namespace-id"
preview_id = "token-cache-preview-id"

# Development environment
[env.development]
vars = { ENVIRONMENT = "development" }
[[env.development.kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production", GOOGLE_CLIENT_ID = "939308613423-nj666hdbq0et0vt893ubmhebvssfhua5.apps.googleusercontent.com", DEFAULT_AI_PROVIDER = "gemini" }
# Bindings are not inherited from the top level — production needs its own D1 binding
[[env.production.d1_databases]]
binding = "DB"
database_name = "finance-manager-db"
database_id = "077138b5-baf3-46e7-83d1-fcc555112a17"
migrations_dir = "db/migrations"
[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"
