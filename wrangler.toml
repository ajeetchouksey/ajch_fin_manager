name = "ajch-fin-manager"
main = "dist/worker.js"
compatibility_date = "2026-10-12"
account_id = "e898ebfc013f074cde300a1ed1c16418"
workers_dev = true

# Environment variables and secrets
[vars]
GOOGLE_CLIENT_ID = "939308613423-nj666hdbq0et0vt893ubmhebvssfhua5.apps.googleusercontent.com"
CLAUDE_API_KEY = ""
GEMINI_API_KEY = ""
OPENAI_API_KEY = ""
DEFAULT_AI_PROVIDER = "gemini"
ENVIRONMENT = "production"

# Cloudflare D1 database for finance data and onboarding
[[d1_databases]]
binding = "DB"
database_name = "finance-manager-db"
database_id = "d1-database-id"

# Cloudflare KV namespace for user sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"

# KV namespace for AI token cache (optional, for performance)
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "token-cache-namespace-id"
preview_id = "token-cache-preview-id"

# Development environment
[env.development]
vars = { ENVIRONMENT = "development" }
[[env.development.kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"

# Production environment
[env.production]
vars = { ENVIRONMENT = "production", GOOGLE_CLIENT_ID = "939308613423-nj666hdbq0et0vt893ubmhebvssfhua5.apps.googleusercontent.com", CLAUDE_API_KEY = "", GEMINI_API_KEY = "", OPENAI_API_KEY = "", DEFAULT_AI_PROVIDER = "gemini" }
[[env.production.kv_namespaces]]
binding = "SESSIONS"
id = "b95f19c9673e457c9faea59f81bf1a03"
preview_id = "b95f19c9673e457c9faea59f81bf1a03"
