name: Nightly Test Suite

on:
  schedule:
    # Every night at 2 AM UTC (convenient for European timezone)
    - cron: '0 2 * * *'
  # Allow manual triggering
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===== CHECKS THAT MUST PASS =====
  nightly:
    name: Type check, unit and frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Type check (Worker)
        run: npm run type-check

      - name: Unit tests (Worker)
        run: npm run test:unit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Frontend type check and build
        working-directory: frontend
        run: |
          npx tsc -b
          npm run build

  # ===== SERVER AND BROWSER TESTS (INFORMATIONAL) =====
  # These need the Worker running on port 8787 and the frontend on 5173, and some of them are known to
  # fail (see docs/testing-status.md). They run for visibility and do not fail the nightly run.
  server-tests:
    name: Server tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build

      - name: Start Worker
        run: |
          npx wrangler dev --port 8787 > worker.log 2>&1 &
          for i in $(seq 1 40); do curl -s -o /dev/null http://localhost:8787/api/health && exit 0; sleep 3; done
          cat worker.log; exit 1

      - name: Security, integration and UAT tests
        run: npx jest src/__tests__/security.test.ts src/__tests__/integration.test.ts src/__tests__/uat.test.ts

      - name: Upload Worker log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-log
          path: worker.log
          retention-days: 14

  # ===== SUMMARY =====
  notify:
    name: Test Results Summary
    needs: [nightly, server-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Write summary
        run: |
          {
            echo "## Nightly test run"
            echo ""
            echo "- Type check, unit and frontend tests: **${{ needs.nightly.result }}**"
            echo "- Server tests (informational): **${{ needs.server-tests.result }}**"
            echo "- Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
