name: Nightly Full Test Suite

on:
  schedule:
    # Run every night at 2 AM UTC (convenient for European timezone)
    - cron: '0 2 * * *'
  # Allow manual triggering
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===== FULL TEST SUITE =====
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run TypeScript check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:unit || true

      - name: Run integration tests
        run: npm run test:integration

      - name: Run security tests
        run: npm run test:security

      - name: Run UAT tests
        run: npm run test:uat

      - name: Run E2E tests
        run: npm run test:e2e
        continue-on-error: true

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            playwright-report/
          retention-days: 30

  # ===== NOTIFICATION =====
  notify:
    name: Test Results Notification
    needs: full-test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Test Results Summary
        run: |
          echo "## Nightly Full Test Suite Results"
          echo ""
          echo "**Status:** ${{ needs.full-test.result }}"
          echo ""
          echo "- Full test suite completed"
          echo "- Integration tests run"
          echo "- Security tests run"
          echo "- UAT tests run"
          echo "- E2E tests run"
          echo "- Coverage report generated"

      - name: Create deployment summary
        run: |
          echo "## Nightly Test Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Suite:** Full" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.full-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
